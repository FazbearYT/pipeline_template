name: 🔒 Security CI/CD Pipeline

on:
  push:
    branches: [develop, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read  # Нужно для upload-sarif@v4

jobs:
  security-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================== 1. SAST (Semgrep) ====================
      - name: 🛡️ Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/default
            p/security-audit
          args: >-
            --sarif
            --output=semgrep.sarif
            --error  # Exit code 1 при HIGH/CRITICAL находках

      # ==================== 2. Secret Scanning ====================
      - name: 🕵️ Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            detect
            --report-format=sarif
            --report-path=gitleaks-results.sarif
            --log-level=warn
            --exit-code=0

      - name: 🔑 Run Trivy Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'  # Правильный параметр для сканирования секретов
          format: 'sarif'
          output: 'trivy-secrets.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # ==================== 3. SCA (Trivy) ====================
      - name: 📦 Run Trivy SCA (Python)
        if: ${{ hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != '' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'  # Сканирование уязвимостей зависимостей
          format: 'sarif'
          output: 'trivy-sca-python.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 📦 Run Trivy SCA (Go)
        if: ${{ hashFiles('go.mod') != '' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-sca-go.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 📦 Run Trivy SCA (C/C++)
        if: ${{ hashFiles('conan.lock') != '' || hashFiles('vcpkg.json') != '' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-sca-cpp.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # ==================== 4. Upload Results to GitHub ====================
      - name: 📤 Upload Semgrep SARIF
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

      - name: 📤 Upload Gitleaks SARIF
        if: ${{ always() && hashFiles('gitleaks-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks-secrets

      - name: 📤 Upload Trivy Secrets SARIF
        if: ${{ always() && hashFiles('trivy-secrets.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

      - name: 📤 Upload Trivy SCA (Python) SARIF
        if: ${{ always() && (hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != '') && hashFiles('trivy-sca-python.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-sca-python.sarif
          category: trivy-sca-python

      - name: 📤 Upload Trivy SCA (Go) SARIF
        if: ${{ always() && hashFiles('go.mod') != '' && hashFiles('trivy-sca-go.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-sca-go.sarif
          category: trivy-sca-go

      - name: 📤 Upload Trivy SCA (C/C++) SARIF
        if: ${{ always() && (hashFiles('conan.lock') != '' || hashFiles('vcpkg.json') != '') && hashFiles('trivy-sca-cpp.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-sca-cpp.sarif
          category: trivy-sca-cpp
