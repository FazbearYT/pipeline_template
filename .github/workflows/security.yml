name: 🔒 Security CI/CD Pipeline

on:
  push:
    branches: [develop, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [develop]
  workflow_dispatch: # Ручной запуск через вкладку Actions

permissions:
  contents: read
  security-events: write # Обязательно для загрузки SARIF в GitHub Security Tab

jobs:
  security-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Позволяет завершить остальные сканеры, даже если один упал

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Обязательно для сканирования полной истории Git

      # ==================== 1. SAST (Semgrep) ====================
      - name: 🛡️ Run Semgrep SAST
        uses: semgrep/semgrep-action@v2
        with:
          config: >-
            p/default
            p/security-audit
          generate-sarif-report: true
          sarif_file: semgrep-results.sarif
          # Отключаем авто-загрузку, чтобы контролировать её явно
          upload: false

      # ==================== 2. Secret Scanning ====================
      - name: 🕵️ Run Gitleaks (Full History)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Опционально (не нужен для public-репо)
        with:
          args: >-
            detect
            --report-format=sarif
            --report-path=gitleaks-results.sarif
            --log-level=warn

      - name: 🔑 Run Trivy Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'secret'
          format: 'sarif'
          output: 'trivy-secrets.sarif'
          exit-code: '0'

      # ==================== 3. SCA (Trivy) ====================
      - name: 📦 Run Trivy SCA (Python)
        if: ${{ hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != '' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-sca-python.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 📦 Run Trivy SCA (Go)
        if: ${{ hashFiles('go.mod') != '' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-sca-go.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 📦 Run Trivy SCA (C/C++)
        if: ${{ hashFiles('conan.lock') != '' || hashFiles('vcpkg.json') != '' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-sca-cpp.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # ==================== 4. Upload Results to GitHub ====================
      - name: 📤 Upload Semgrep SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-sast

      - name: 📤 Upload Gitleaks SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks-secrets

      - name: 📤 Upload Trivy Secrets SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

      - name: 📤 Upload Trivy SCA (Python) SARIF
        if: ${{ always() && (hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != '') }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-sca-python.sarif
          category: trivy-sca-python

      - name: 📤 Upload Trivy SCA (Go) SARIF
        if: ${{ always() && hashFiles('go.mod') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-sca-go.sarif
          category: trivy-sca-go

      - name: 📤 Upload Trivy SCA (C/C++) SARIF
        if: ${{ always() && (hashFiles('conan.lock') != '' || hashFiles('vcpkg.json') != '') }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-sca-cpp.sarif
          category: trivy-sca-cpp